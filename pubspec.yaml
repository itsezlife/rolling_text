name: rolling_text
description: >
  Per-character vertical rolling text animation. Features spring physics, stagger,
  direction-aware number rolling, chromatic tints, and built-in loader loops.
version: 0.1.3

homepage: https://luisportal.com/labs
repository: https://github.com/lportals/rolling_text
issue_tracker: https://github.com/lportals/rolling_text/issues

topics:
  - animation
  - text
  - counter
  - slot
  - number

environment:
  sdk: ^3.11.1
  flutter: ">=3.29.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  fake_async: ^1.3.0

flutter:
  uses-material-design: false
